name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; a cancelled run on main would block Render's deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the required status check in the main ruleset (CONTRIBUTING.md).
  # No `paths` filters: a skipped workflow would leave required checks pending.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format (Biome)
        run: npx biome ci .

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build the web app
        run: npm run build
